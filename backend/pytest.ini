[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    live_ollama: integration tests targeting real local Ollama service (deselect with '-m "not live_ollama"')
    live_groq: integration tests targeting real Groq API (deselect with '-m "not live_groq"')
testpaths = tests
python_files = test_*.py
