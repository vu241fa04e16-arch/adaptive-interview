services:
  - type: web
    name: adaptive-interview-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_TIMEOUT_SECONDS
        value: "60.0"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: adaptive-interview-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: adaptive-interview-db
    databaseName: adaptive_interview
    user: interview_db_user
    plan: free
